name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-test:
    strategy:
      # One distro's toolchain going down should not erase the signal from the
      # other. On 2026-09-04 setup-ros failed on jammy in 21 s, before compiling
      # anything, and fail-fast cancelled a Jazzy job that was perfectly healthy.
      # The result was a bare red X on main for an upstream outage.
      fail-fast: false
      matrix:
        include:
          - ros_distro: jazzy
            os: ubuntu-24.04
          - ros_distro: humble
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}

      # Before anything is built: ROS 2 silently ignores a parameter a node never
      # declared, so a typo in a shipped config has no effect and no error, and
      # the user drives believing the gate is tuned. Needs no ROS, so it runs
      # first and fails fast.
      - name: Check shipped configs against declared parameters
        run: python3 tools/check_config_params.py --quiet

      - name: Install rosdep dependencies
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.sh
          sudo rosdep init 2>/dev/null || true
          rosdep update
          rosdep install -r --from-paths . --ignore-src --rosdistro ${{ matrix.ros_distro }} -y

      - name: Build
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.sh
          colcon build \
            --packages-up-to compass_msgs fusioncore_core fusioncore_ros \
            --cmake-args -DBUILD_TESTING=ON \
            --event-handlers console_cohesion+

      - name: Run quick-start smoke test
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.sh
          source install/local_setup.bash
          bash tools/quick_test.sh

      - name: Test
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.sh
          source install/local_setup.bash
          colcon test \
            --packages-select compass_msgs fusioncore_core fusioncore_ros \
            --event-handlers console_direct+

      - name: Check test results
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.sh
          colcon test-result --verbose
