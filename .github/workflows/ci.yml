name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-test:
    strategy:
      # One distro's toolchain going down should not erase the signal from the
      # other. On 2026-09-04 setup-ros failed on jammy in 21 s, before compiling
      # anything, and fail-fast cancelled a Jazzy job that was perfectly healthy.
      # The result was a bare red X on main for an upstream outage.
      fail-fast: false
      matrix:
        include:
          - ros_distro: jazzy
            os: ubuntu-24.04
          - ros_distro: humble
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Attempted twice on purpose. setup-ros resolves the ros-apt-source version
      # with a bare `curl -s`, no --fail, no --retry and no fallback, and then
      # interpolates the result straight into a download URL:
      #
      #   export ROS_APT_SOURCE_VERSION=$(curl -s $repo | grep -F tag_name | awk ...)
      #
      # Any blip on that one call yields an empty version, the URL collapses to
      # .../download//ros2-apt-source_.<codename>_all.deb, and the job dies in 12 s
      # before compiling anything. The download curl immediately after it DOES carry
      # --retry 3; only the version lookup is unprotected, and the action exposes no
      # input to pin or skip it, while `export` overwrites anything preset in env.
      #
      # Three occurrences so far: 2026-09-04 on jammy, and twice on 2026-10-05, once
      # per distro. A second attempt seconds later clears a transient blip. It will
      # not clear a sustained upstream outage, which is what fail-fast: false above is
      # for, so this reduces the noise rather than pretending to fix the action.
      - uses: ros-tooling/setup-ros@v0.7
        id: setup_ros
        continue-on-error: true
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}

      - uses: ros-tooling/setup-ros@v0.7
        if: steps.setup_ros.outcome == 'failure'
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}

      # ONE entry point, and CI calls the same script a developer does.
      #
      # These used to be six separate steps, and a local sweep that grepped stdout
      # instead of reading exit codes reported everything ok for three commits while
      # CI was red on check_config_wiring.py, whose failure message contains none of
      # the words that sweep looked for. Two verification paths, and the weaker one
      # won. check_all.sh reads exit codes and nothing else, so a grep cannot drift
      # from the contract again.
      #
      # Needs no ROS, so it runs before the build and fails fast.
      - name: Run every repo checker
        run: bash tools/check_all.sh

      # Every test under tools/, not just the checkers' own. A checker that cannot
      # fail is worse than no checker, which is why each one has a test that breaks
      # its input and asserts exit 1.
      #
      # This glob was tools/test_check_*.py until 2026-10-08, which silently skipped
      # six files and 61 cases: the bag reader, the wheel-geometry fit, the NCLT
      # frame guard for #169, the NIS reader, the spike injector and the turn gate.
      # They all passed, so nothing was broken, but nothing was being guarded either.
      # A test CI does not run is decoration. Keep this glob wide.
      # evo is what evaluate.py computes ATE with, and evaluate.py produces the
      # numbers the regression gate reads, so CI has to be able to run it. Plain
      # pip first because 22.04 ships a pip that does not know the flag, then the
      # PEP 668 override that 24.04 needs. The import check is deliberate: a failed
      # install has to be red HERE, otherwise test_evaluate.py degrades to a skip
      # and a tool nothing exercised would look tested.
      - name: Install evo (trajectory evaluation)
        run: |
          python3 -m pip install evo || python3 -m pip install evo --break-system-packages
          python3 -c "import evo; print('evo', evo.__version__)"

      - name: Test the tools
        run: |
          set -e
          shopt -s nullglob
          tests=(tools/test_*.py)
          # A glob that matches nothing would make this step pass without running
          # anything, which is the failure mode check_all.sh exists to prevent:
          # "could not run" must never read as "passed". Floor it well under the
          # real count so adding or moving a file does not trip it.
          if [ "${#tests[@]}" -lt 10 ]; then
            echo "only ${#tests[@]} test files matched tools/test_*.py, expected at least 10"
            exit 1
          fi
          for t in "${tests[@]}"; do
            echo "== $t"
            python3 -m unittest "$t"
          done

      - name: Gate any committed benchmark results
        run: |
          shopt -s nullglob
          results=(benchmarks/nclt/*/results*/metrics.json)
          if [ ${#results[@]} -eq 0 ]; then
            echo "No committed metrics.json to gate. The NCLT run is a pre-tag step:"
            echo "  tools/run_nclt.sh <sequence> <out_dir> 1.0"
            echo "  python3 tools/check_benchmark_regression.py <out_dir>/res/metrics.json"
          else
            python3 tools/check_benchmark_regression.py "${results[@]}"
          fi

      - name: Install rosdep dependencies
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.sh
          sudo rosdep init 2>/dev/null || true
          rosdep update
          rosdep install -r --from-paths . --ignore-src --rosdistro ${{ matrix.ros_distro }} -y

      # fusioncore_ublox builds its Doppler bridge only under
      # find_package(ublox_msgs QUIET), so without ublox_msgs present the whole
      # target is skipped and any error in it is invisible. That is not
      # hypothetical: gnss_doppler_bridge.cpp read msg->header.stamp on a NavPVT,
      # which has no header at all, so the file could never compile for anyone who
      # actually had the dependency. It sat that way because CI did not build the
      # package and nobody else had ublox_msgs installed.
      #
      # Non-fatal on purpose: if the distro has no ublox-msgs the build below just
      # skips the bridge again, exactly as a user without it would.
      - name: Install optional ublox_msgs so the Doppler bridge is actually compiled
        run: sudo apt-get install -y ros-${{ matrix.ros_distro }}-ublox-msgs || true

      - name: Build
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.sh
          colcon build \
            --packages-up-to compass_msgs fusioncore_core fusioncore_ros fusioncore_ublox \
            --cmake-args -DBUILD_TESTING=ON \
            --event-handlers console_cohesion+

      - name: Test
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.sh
          source install/local_setup.bash
          colcon test \
            --packages-select compass_msgs fusioncore_core fusioncore_ros \
            --event-handlers console_direct+

      - name: Check test results
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.sh
          colcon test-result --verbose

      # Last, deliberately. It launches real nodes, so it is the slowest and the
      # most environment-dependent step, and a failure here must not skip the
      # unit tests: when it ran before them a smoke failure hid which tests
      # passed, which cost a diagnosis round trip on the PR that added it.
      - name: Run quick-start smoke test
        timeout-minutes: 5
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.sh
          source install/local_setup.bash
          bash tools/quick_test.sh
