# navsat_transform_node: converts /gnss/fix (lat/lon) → /gps/odometry (local ENU)
# This feeds into rl_ekf's odom1 input.
# navsat_transform needs the EKF's /odometry/filtered output to get the current
# heading: this creates the standard RL feedback loop.
navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 0.0
    magnetic_declination_radians: 0.0   # not using magnetometer
    yaw_offset: 0.0
    zero_altitude: true               # ground robot: z from GPS is unreliable, keep z=0
    broadcast_utm_transform: false
    publish_filtered_gps: false
    use_odometry_yaw: true              # take heading from the EKF, not the IMU.
                                        # With false, navsat never latches its transform and
                                        # re-initialises the local origin on EVERY fix (measured
                                        # 949 times in 70 s, and 12399/12399 on a full sequence).
                                        # /gps/odometry still publishes, but every position is
                                        # relative to an origin that keeps jumping, so RL-EKF is
                                        # fed GPS that always reads "near zero": measured
                                        # within_10m 0.0% and drift 28.8 m/km against 89.3% and
                                        # 1.40 m/km in the archived results. With true the datum
                                        # latches once. This makes the RL baseline honest; a
                                        # benchmark against a crippled competitor is worthless.
    wait_for_datum: false               # auto-initialize from first GPS fix
    use_sim_time: true
