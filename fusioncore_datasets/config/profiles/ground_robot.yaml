# Profile: ground_robot
#
# For a wheeled robot with working wheel odometry. REQUIRES ENCODERS: it freezes the
# states the IMU cannot resolve on its own, which is only safe because the encoder
# measures yaw rate directly and carries the constraint instead.
#
# Do not use this on a drone, a boat, or anything without odometry.
#
# Measured on NCLT at 1x against the shipped config, controls inside 0.5%, 2026-10-17,
# before the dataset player's tilt fix (direction, not current figures; no re-anchoring):
#   2012-06-15   82.011 -> 32.149   -60.80%
#   2013-04-05   14.058 ->  9.193   -34.61%
#   2012-08-20  155.618 -> 157.591   +1.27%   about 10x its 0.13% spread, slightly worse
#
# Copy this block into your config, or load this file and override individual keys
# after it.
fusioncore:
  ros__parameters:
    # Stop driving the states that are not observable from this sensor set. Setting
    # the process noise to zero stops anything pushing them; the tight initial sigma
    # stops a measurement pulling them. Both are needed, or a q=0 state still wanders
    # whenever a measurement happens to inform it.
    #
    # The accelerometer measures AX + B_AX + gravity. One equation, three unknowns,
    # and the literature is explicit that accel bias is completely unobservable in
    # straight motion. The filter was estimating all three; r(WZ,B_GZ) reaches -0.998 on a
    # synthetic in-place spin (test_observability.cpp), -0.63 to -0.04 on NCLT.
    ukf.q_acceleration:     0.0
    ukf.q_accel_bias:       0.0
    ukf.q_gyro_bias:        0.0
    ukf.q_encoder_wz_bias:  0.0

    imu.gyro_bias_initial_sigma:    1.0e-6
    imu.accel_bias_initial_sigma:   1.0e-6
    encoder.wz_scale_initial_sigma: 1.0e-6

    # Re-anchoring after a GPS outage, on from 0.5.0. When the outlier gate has been
    # refusing most of what arrives and the recent fixes agree with wheel odometry, jump
    # position onto them instead of waiting for the gate to let them in. Position only.
    # Measured on all twelve NCLT sequences (tools/eval_20261025_results.md, replay):
    # RMSE lower on 10, higher on none; but median higher on 4 (+0.3% to +3.0%) and
    # output-rate jitter higher on 3 (up to +0.124), so it FAILED its ship rule on those
    # secondary clauses. Through the ROS node on 2012-01-08 it read 10.882 m at GPS fix
    # times against replay's 10.898 m. On here as a product decision with those costs.
    # Each re-anchor is a deliberate position jump, published on /fusion/debug/gnss_status
    # (reanchored, reanchor_jump_m); a consumer that cannot see it will read it as
    # divergence. Set false to opt out.
    gnss.reanchor_enabled: true

    # Why freezing the gyro bias does not wreck heading: the encoder measures yaw rate
    # with no bias term, so the constraint moves to the sensor that can carry it.
    # Stress tested in simulation, 6 seeds, a 600 s loop with turns and a 300 s GNSS
    # blackout, mean RMS position error against shipped:
    #     perfect encoder                       -62.6%   5 of 6 seeds better
    #     10% encoder scale error               -63.1%   6 of 6
    #     NCLT-grade 29.7% scale error          -56.2%   6 of 6
    #     that AND a 20 deg/s MPU-6050 bias     -58.2%   6 of 6
    # Both stress rows exist because the result is only meaningful if it survives a
    # real bias and a bad encoder. If your encoder is worse than 30% out, fix that
    # first; tools/bag_report.py will tell you.
